<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balcão de Atendimento</title>
    <link rel="icon" type="image/png" href="imagens/logoGLPC.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;800&display=swap" rel="stylesheet">

    <style>
        /* APARÊNCIA GERAL DA PÁGINA */
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(to bottom, #FF3CAC, #2BE7FF);
            color: #fff;
            font-family: 'Montserrat', sans-serif;

            display: flex;
            justify-content: center;
            align-items: flex-start;
            text-align: center;
        }

        .texto-gradiente {
            background: linear-gradient(to bottom, #d8ff2b, #b3ff00);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        #tela {
    width: 100%;
    max-width: 850px;
    padding: 100px 30px 30px;
}

        h1 {
            font-size: clamp(1.2rem, 3vw, 2rem);
            margin-bottom: 40px;
        }

/* BOTÕES DA TELA DE VOTAÇÃO */
.acoes-votacao {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    margin-top: 25px;
}

.acoes-votacao button {
    width: 100%;
    max-width: 255px;
}

.ampulheta-carregando {
    width: 22px;
    height: 22px;
    animation: girar-ampulheta 1.2s linear infinite;
}

@keyframes girar-ampulheta {
    to {
        transform: rotate(360deg);
    }
}

/* BOTÃO VOLTAR CINZA */
.btn-voltar {
    background: linear-gradient(135deg, #05dd71, #dbdf0a) !important;
    border: 2px solid rgba(255, 255, 255, 0.6) !important;
    color: rgb(10, 10, 10);
}

.btn-voltar:hover {
    background: linear-gradient(135deg, #888, #555) !important;
}

        .botoes {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        button {
            background: linear-gradient(#f565ca, #c926d8af) padding-box,
                linear-gradient(to bottom, #f8f8f859, #fffeff56) border-box;
            color: #f7f2f6;
            border: 3px solid transparent;
            border-radius: 8px;
            padding: 15px 35px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background-color: #0fd4f7;
            color: #fff;
        }

        /* FORMULÁRIO DE RECLAMAÇÕES E SUGESTÕES */
        .formulario-reclamacao {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
        }

        .campo-nome {
            display: flex;
            gap: 10px;
            align-items: stretch;
        }

        .campo-nome input {
            flex: 1;
            min-width: 0;
            width: 100%;
            padding: 14px;
            border: 2px solid white;
            border-radius: 8px;
            font-family: 'Montserrat', sans-serif;
            font-size: 1rem;
        }

        .botao-anonimo {
            padding: 10px 14px;
            font-size: 0.85rem;
            white-space: normal;
        }

        @media (max-width: 600px) {
            .campo-nome {
                flex-direction: column;
            }
        }

        .formulario-reclamacao label {
            text-align: left;
            font-weight: 700;
        }

        .formulario-reclamacao select,
        .formulario-reclamacao textarea {
            width: 100%;
            padding: 14px;
            border: 2px solid white;
            border-radius: 8px;
            font-family: 'Montserrat', sans-serif;
            font-size: 1rem;
        }

        .formulario-reclamacao textarea {
            min-height: 150px;
            resize: vertical;
        }

        /* BOTÃO EXCLUSIVO DE RECLAMAÇÃO */
        .botao-reclamacao {
            background: linear-gradient(135deg, #ff3333, #8b0000);
            color: white;
            border: 2px solid white;
            border-radius: 8px;
            padding: 10px 30px;
            font-family: 'Montserrat', sans-serif;
            font-size: 1.0rem;
            font-weight: 800;
            cursor: pointer;
            transition: 0.3s;
        }

        .botao-reclamacao:hover {
            background: linear-gradient(135deg, #ff6666, #cc0000);
            transform: scale(1.05);
        }

        /* FORMULÁRIO DE SOLICITAÇÃO DE ROLÊ */

.formulario-role {
    display: flex;
    flex-direction: column;
    gap: 15px;
    width: 100%;
    max-width: 600px;
    margin: 0 auto;
    text-align: left;
}

.formulario-role label {
    font-weight: 700;
}

.formulario-role input[type="date"],
.formulario-role select,
.formulario-role textarea {
    width: 100%;
    padding: 14px;
    border: 2px solid white;
    border-radius: 8px;
    font-family: 'Montserrat', sans-serif;
    font-size: 1rem;
}

.formulario-role textarea {
    min-height: 130px;
    resize: vertical;
}

        /* TRANSIÇÃO ENTRE TELAS */
        #tela > * {
            animation: aparecer 0.4s ease both;
        }

        @keyframes aparecer {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

       /* BORDA DECORATIVA DA PÁGINA */
body {
    position: relative;
}

body::before {
    content: "";
    position: absolute;
    inset: 15px;
    border: 3px solid #fdfdfd;
    border-radius: 10px;
    pointer-events: none;
    z-index: 9999;
}

        .opcoes-interesse {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 10px;
        }

        .opcoes-interesse label {
            padding: 12px 16px;
            border: 2px solid white;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
        }

        .opcoes-interesse input[type="radio"] {
            display: none;
        }

        .opcoes-interesse input[type="radio"]:checked + label {
            background: #FF3CAC;
            border-color: #FF3CAC;
            color: white;
            transform: scale(1.03);
        }

        .btn-trocar-usuario {
    position: absolute;
    top: 15px;
    right: 15px;

    background-color: #444;
    color: #fff;

    padding: 8px 12px;
    font-size: 12px;

    border: none;
    border-radius: 8px;

    cursor: pointer;
    transition: 0.3s;
}

.btn-trocar-usuario:hover {
    background-color: #666;
    transform: scale(1.05);
}

.card-bloqueado {
    opacity: 0.45;
    filter: grayscale(100%);
    cursor: not-allowed;
}

/* GRADE DOS PARTICIPANTES */
.lista-participantes {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 15px;

    width: 100%;
    max-width: 600px;
    margin: 30px auto;
}

/* CARD INDIVIDUAL */
.card-participante {
    width: 100%;
    min-width: 0;
}

/* FOTO DO PARTICIPANTE */
.card-participante img {
    display: block;
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    border-radius: 12px;
}

/* CELULAR */
@media (max-width: 600px) {
    .lista-participantes {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
    }
}


/* CARD DOS PARTICIPANTES */
.card-participante {
    background: rgba(255, 255, 255, 0.18);
    border: 2px solid rgba(255, 255, 255, 0.5);
    border-radius: 14px;
    padding: 10px;
    transition: 0.25s;
}

/* ÁREA CLICÁVEL */
.opcao-participante {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    cursor: pointer;
}

/* ESCONDE O RADIO ORIGINAL */
.opcao-participante input {
    position: absolute;
    opacity: 0;
}

/* NOME */
.opcao-participante h3 {
    margin: 5px 0;
    font-size: 0.95rem;
}

/* BOTÃO VISUAL DE SELEÇÃO */
.seletor-voto {
    background: rgba(255, 255, 255, 0.2);
    border: 1px solid white;
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 0.75rem;
    font-weight: bold;
}

/* CARD SELECIONADO */
.card-participante:has(input:checked) {
    background: #ff3cac;
    border-color: white;
    transform: scale(1.04);
    box-shadow: 0 0 15px rgba(255,255,255,0.5);
}

/* TEXTO DO CARD SELECIONADO */
.card-participante:has(input:checked) .seletor-voto {
    background: white;
    color: #c926d8;
}

/* CARD BLOQUEADO */
.card-bloqueado {
    opacity: 0.45;
    filter: grayscale(100%);
    cursor: not-allowed;
}

.card-bloqueado .opcao-participante {
    cursor: not-allowed;
}

/* CABEÇALHO GLPC */
.cabecalho-glpc {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px;
    width: 100%;
    margin: 0 auto 15px;
    position: relative;
    top: -40px;
}

/* LOGO */
.logo-glpc {
    width: clamp(180px, 60%, 480px);
    height: auto;
    object-fit: contain;
}

/* FOTO REDONDA DO GRUPO */
.foto-grupo {
    width: clamp(75px, 18vw, 120px);
    aspect-ratio: 1 / 1;
    object-fit: cover;
    border-radius: 50%;
    border: 3px solid white;
    box-shadow: 0 0 12px rgba(255, 255, 255, 0.4);
    flex-shrink: 0;
}

/* AJUSTE PARA CELULAR */
@media (max-width: 480px) {
    .cabecalho-glpc {
        gap: 10px;
    }

    .logo-glpc {
        width: 65%;
    }
}

/* ÁREA DE IDENTIFICAÇÃO */
.insert {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
    width: 100%;
    max-width: 520px;
    margin: 30px auto;
    align-items: center;
}

/* CAMPO DE NOME */
.insert input {
    grid-column: 1 / -1;
    width: 100%;
    padding: 16px 20px;

    background: rgba(255, 255, 255, 0.92);
    color: #333;

    border: 2px solid rgba(255, 255, 255, 0.8);
    border-radius: 14px;

    font-family: 'Montserrat', sans-serif;
    font-size: 1rem;

    outline: none;
    transition: 0.25s;
}

/* EFEITO AO CLICAR NO CAMPO */
.insert input:focus {
    border-color: #ff3cac;
    box-shadow: 0 0 12px rgba(255, 60, 172, 0.5);
    background: white;
}

/* TEXTO DO PLACEHOLDER */
.insert input::placeholder {
    color: #999;
}

/* BOTÕES DA IDENTIFICAÇÃO */
.insert button {
    width: 100%;
    min-width: 0;
    padding: 15px 10px;
    font-size: 1rem;
    border-radius: 12px;
}

/* AJUSTE PARA CELULARES */
@media (max-width: 480px) {
    .insert {
        max-width: 360px;
        gap: 10px;
    }

    .insert button {
        font-size: 0.85rem;
        padding: 14px 8px;
    }
}

/* CARDS DOS PRÓXIMOS ROLÊS */
.card-role {
    background: rgba(255, 255, 255, 0.18);
    border: 2px solid rgba(255, 255, 255, 0.5);
    border-radius: 16px;
    padding: 20px;
    margin: 20px auto;
    text-align: center;
    max-width: 600px;
    transition: 0.3s;
    overflow: hidden;
}

.card-role img {
    width: 100%;
    height: 100px;
    display: block;
    object-fit: cover;
    border-radius: 10px;
    margin-bottom: 10px;
}

.card-role > img {
    width: calc(100% + 40px);
    height: 100px;
    margin: -20px -20px 10px;
}

.card-role:hover {
    transform: scale(1.02);
    background: rgba(255, 255, 255, 0.28);
    box-shadow: 0 5px 20px rgba(255, 255, 255, 0.2);
}

.voto-selecionado {
    transform: scale(1.04);
    border: 2px solid white;
    box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
}

.voto-selecionado.nessa {
    background: linear-gradient(135deg, #00c853, #00e676);
    color: white;
}

.voto-selecionado.fora {
    background: linear-gradient(135deg, #ff3333, #b71c1c);
    color: white;
}

.organizador-role {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 12px;
    margin: 0;
}

.organizador-role img {
    width: 55px;
    height: 55px;
    object-fit: cover;
    border-radius: 50%;
    border: 3px solid white;
    margin: 0;
}

.organizador-role div {
    display: flex;
    flex-direction: column;
    text-align: left;
    gap: 3px;
}

.organizador-role span {
    font-size: 0.75rem;
    opacity: 0.8;
}

.organizador-role strong {
    font-size: 1rem;
}

.descricao-role {
    text-align: left;
    margin: 18px 0;
    padding: 14px;
    background: rgba(0, 0, 0, 0.14);
    border-radius: 12px;
}

.descricao-role p {
    margin: 0;
    line-height: 1.5;
}

.titulo-descricao {
    font-weight: 800;
    margin-bottom: 8px !important;
}

.linha-organizador-data {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin: 15px 0;
}

.data-role {
    margin: 0;
    font-size: 0.9rem;
    font-weight: 700;
    white-space: nowrap;
}

/* CONTADORES DOS PRÓXIMOS ROLÊS */
.contadores-role {
    display: flex;
    justify-content: center;
    gap: 35px;
    margin: 15px 0;
    font-size: 1.2rem;
    font-weight: 800;
}

.botoes-role {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 18px;
}

.botoes-role button {
    flex: 1;
    width: auto;
    max-width: 180px;
    padding: 12px 10px;
    font-size: 0.95rem;
    border-radius: 12px;
}

.icone-carregando {
    font-size: 50px;
    color: white;
    animation: girar 1s linear infinite;
}

@keyframes girar {
    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}

.btn-reclamacao-flutuante {
    position: fixed;
    width: 180px;
    right: 25px;
    bottom: 25px;
    z-index: 1000;
    cursor: pointer;
    transition: transform 0.3s ease;
}

.foto-usuario {
    width: 90px;
    height: 90px;
    object-fit: cover;
    border-radius: 50%;
    border: 3px solid white;
}

.boas-vindas {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px;
    width: 100%;
    margin: 10px auto 65px;
    transform: none;
}

.card-menu {
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 2px solid rgba(255, 255, 255, 0.35);
    border-radius: 20px;
    padding: 25px;
    max-width: 600px;
    margin: 20px auto 30px;
}

.card-menu .botoes {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
}

.card-menu .botoes button {
    width: 100%;
    max-width: 1000px;
    padding: 0;
    border: none;
    background: transparent;
    box-shadow: none;
    cursor: pointer;
    min-width: 100%;
} 

.card-menu .botoes button img {
    display: block;
    width: 100%;
    height: auto;
    object-fit: contain;
}


.card-amigo-mes {
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);

    border: 3px solid transparent;
    border-radius: 20px;
    padding: 25px;
    max-width: 650px;
    margin: 30px auto;
    position: relative;
    isolation: isolate;

    box-shadow:
        0 0 8px rgba(255, 0, 255, 0.55),
        0 0 18px rgba(0, 220, 255, 0.35);
}

/* BORDA RGB */
.card-amigo-mes::before {
    content: "";
    position: absolute;
    inset: -3px;
    padding: 3px;
    border-radius: inherit;
    pointer-events: none;

    background: linear-gradient(
        90deg,
        red,
        magenta,
        blue,
        cyan,
        lime,
        yellow,
        red
    );

    -webkit-mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;

    mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);
    mask-composite: exclude;

    z-index: -1;
    animation: rgb-borda 5s linear infinite;
}

@keyframes rgb-borda {
    from {
        filter: hue-rotate(0deg);
    }

    to {
        filter: hue-rotate(360deg);
    }
}



@media (max-width: 800px) {

    gap: 8px;
}
.podio-primeiro img {

}

.podio-segundo img,
.podio-terceiro img {

}
    .btn-reclamacao-flutuante {
        width: 100px;
        right: 0px;

    }
}

.btn-reclamacao-flutuante {
    z-index: 99999;
}

.podio-segundo img,

.podio-primeiro {

.podio-segundo {
    order: 1;

    order: 3;
}

.cabecalho-amigo-mes {
    position: relative;

}

.cabecalho-amigo-mes select {
    position: absolute;

}

.cabecalho-amigo-mes h2 {
    margin-top: -15px;
}

#seletor-mes-amigo {

}

#seletor-mes-amigo {
    position: absolute;
    bottom: 5px;

    width: 125px;

    font-size: 12px;

}

.quantidade-votos {
    margin-top: 12px;
    margin-bottom: 20px;
    position: relative;
    top: -8px;
}

.imagem-identificacao {
    width: 100%;
    overflow: hidden;
}

.faixa-identificacao {
    display: flex;
    width: max-content;
    animation: letreiro-identificacao 3s linear infinite;
}

.faixa-identificacao img {
    display: block;
    width: 100vw;
    height: auto;

}

@keyframes letreiro-identificacao {
    from {
        transform: translateX(0);
    }

    to {
        transform: translateX(-50%);
    }
}

</head>

<body>

    <main id="tela"></main>

    <script>
        const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbztN028k65cUeiFn6jtwVWi8uXrYU4pXOXEWG5_wvJhzeWFJn6pBxkc1OdyrG37-iTE/exec";

        let votosAmigoMes = [];
        let mesSelecionadoAmigoMes = "";

        const participantes = [
    { nome: "Marcelo", foto: "imagens/marcelo.jpg" },
    { nome: "Bruna", foto: "imagens/bruna.jpg" },
    { nome: "Lorran", foto: "imagens/lorran.jpg" },
    { nome: "Luiza", foto: "imagens/luiza.jpg" },
    { nome: "Paloma", foto: "imagens/paloma.jpg" },
    { nome: "Arthur", foto: "imagens/arthur.jpg" },
    { nome: "Tomás", foto: "imagens/tomas.jpg" },
    { nome: "Matheus", foto: "imagens/matheus.jpg" },
    { nome: "Nívea", foto: "imagens/nivea.jpg" },
    { nome: "Deyber", foto: "imagens/deyber.jpg" },
    { nome: "Michael", foto: "imagens/michael.jpg" },
    { nome: "Paulo", foto: "imagens/paulo.jpg" }

];

// GERAR CARDS VOTAÇÃO AMIGOS

function gerarCardsParticipantes() {

    const container = document.getElementById("listaParticipantes");

    container.innerHTML = "";

    const nomeUsuario = localStorage.getItem("nomeUsuario");

    participantes.forEach(participante => {

        const bloqueado = nomeUsuario.trim().toLowerCase() === participante.nome.trim().toLowerCase();

        
const card = `
    <div class="card-participante ${bloqueado ? "card-bloqueado" : ""}">

        <label class="opcao-participante">

            <input
                type="radio"
                name="votoAmigo"
                value="${participante.nome}"
                ${bloqueado ? "disabled" : ""}
            >

            <img src="${participante.foto}" alt="${participante.nome}">

            <h3>${participante.nome}</h3>

            <span class="seletor-voto">Selecionar</span>

        </label>

    </div>
`;


        container.innerHTML += card;

    });

}


function telaVotacao() {

function calcularRankingAmigos(votos, mesSelecionado) {
    const ranking = {};

votos.forEach(voto => {
    const indicado = voto[2];

    const dataVoto = voto[0];

    const [dia, mes, resto] = dataVoto.split("/");
    const [ano] = resto.split(" ");

    const mesAnoVoto = `${mes}/${ano}`;

    if (mesAnoVoto !== mesSelecionado) {
    return;
}

    if (!ranking[indicado]) {
    ranking[indicado] = {
        votos: 0,
        ultimoVoto: ""
    };
}

ranking[indicado].votos++;
ranking[indicado].ultimoVoto = voto[0];

});

const listaRanking = Object.entries(ranking);

listaRanking.sort((a, b) => {
    if (b[1].votos !== a[1].votos) {
        return b[1].votos - a[1].votos;
    }

    const converterData = data => {
        const [dia, mes, resto] = data.split("/");
        const [ano, horario] = resto.split(" ");
        const [hora, minuto, segundo] = horario.split(":").map(Number);

        return Date.UTC(
            Number(ano),
            Number(mes) - 1,
            Number(dia),
            hora,
            minuto,
            segundo
        );
    };

    return converterData(b[1].ultimoVoto) - converterData(a[1].ultimoVoto);
});

const topTres = listaRanking.slice(0, 3);
return topTres;

}

` : ""}

function buscarMesesDisponiveis(votos) {

    const meses = [];

    votos.forEach(voto => {

        const dataVoto = voto[0];

const [dia, mes, resto] = dataVoto.split("/");
const [ano] = resto.split(" ");

const mesAno = `${mes}/${ano}`;

if (!meses.includes(mesAno)) {
    meses.push(mesAno);
}

});

meses.sort((a, b) => {
    const [mesA, anoA] = a.split("/").map(Number);
    const [mesB, anoB] = b.split("/").map(Number);

    return (anoB * 100 + mesB) - (anoA * 100 + mesA);
});

return meses;

}
