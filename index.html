        #tela {

/* BOTÕES DA TELA DE VOTAÇÃO */
.acoes-votacao {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    margin-top: 25px;
}

.acoes-votacao button {

    max-width: 255px;
}

/* BOTÃO VOLTAR CINZA */
.btn-voltar {
    background: linear-gradient(135deg, #05dd71, #dbdf0a) !important;
    border: 2px solid rgba(255, 255, 255, 0.6) !important;
    color: rgb(10, 10, 10);
}

.btn-voltar:hover {
    background: linear-gradient(135deg, #888, #555) !important;
}

        .botoes {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        button {
            background: linear-gradient(#f565ca, #c926d8af) padding-box,
                linear-gradient(to bottom, #f8f8f859, #fffeff56) border-box;
            color: #f7f2f6;
            border: 3px solid transparent;
            border-radius: 8px;
            padding: 15px 35px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background-color: #0fd4f7;
            color: #fff;
        }

        /* FORMULÁRIO DE RECLAMAÇÕES E SUGESTÕES */
        .formulario-reclamacao {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
        }

        .campo-nome {
            display: flex;
            gap: 10px;
            align-items: stretch;
        }

        .campo-nome input {
            flex: 1;
            min-width: 0;
            width: 100%;
            padding: 14px;
            border: 2px solid white;
            border-radius: 8px;
            font-family: 'Montserrat', sans-serif;
            font-size: 1rem;
        }

        .botao-anonimo {
            padding: 10px 14px;
            font-size: 0.85rem;
            white-space: normal;
        }

        @media (max-width: 600px) {
            .campo-nome {
                flex-direction: column;
            }
        }

        .formulario-reclamacao label {
            text-align: left;
            font-weight: 700;
        }

        .formulario-reclamacao select,
        .formulario-reclamacao textarea {
            width: 100%;
            padding: 14px;
            border: 2px solid white;
            border-radius: 8px;
            font-family: 'Montserrat', sans-serif;
            font-size: 1rem;
        }

        .formulario-reclamacao textarea {
            min-height: 150px;
            resize: vertical;
        }

        /* BOTÃO EXCLUSIVO DE RECLAMAÇÃO */

            background: linear-gradient(135deg, #ff3333, #8b0000);
            color: white;
            border: 2px solid white;
            border-radius: 8px;
            padding: 15px 35px;
            font-family: 'Montserrat', sans-serif;
            font-size: 1.2rem;
            font-weight: 800;
            cursor: pointer;
            transition: 0.3s;
        }

        .botao-reclamacao:hover {
            background: linear-gradient(135deg, #ff6666, #cc0000);
            transform: scale(1.05);
        }

.formulario-role {

    max-width: 600px;
    margin: 0 auto;
    text-align: left;

.formulario-role label {

}

.formulario-role input[type="date"],
.formulario-role select,

.formulario-role textarea {

}

        /* TRANSIÇÃO ENTRE TELAS */
        #tela > * {
            animation: aparecer 0.4s ease both;
        }

            from {
                opacity: 0;
                transform: translateY(15px);
            }

       /* BORDA DECORATIVA DA PÁGINA */
body {
    position: relative;
}

body::before {
    content: "";
    position: absolute;
    inset: 15px;
    border: 3px solid #fdfdfd;
    border-radius: 10px;
    pointer-events: none;
    z-index: 9999;
}

        .opcoes-interesse {

            flex-wrap: wrap;
            gap: 10px;

            border-radius: 10px;

            transition: 0.2s;
        }

        .opcoes-interesse input[type="radio"] {
            display: none;
        }

        .opcoes-interesse input[type="radio"]:checked + label {
            background: #FF3CAC;
            border-color: #FF3CAC;
            color: white;
            transform: scale(1.03);
        }

        .btn-trocar-usuario {
    position: absolute;
    top: 15px;
    right: 15px;

    background-color: #444;
    color: #fff;

    padding: 8px 12px;
    font-size: 12px;

    border: none;
    border-radius: 8px;

    cursor: pointer;
    transition: 0.3s;
}

.btn-trocar-usuario:hover {
    background-color: #666;
    transform: scale(1.05);
}

.card-bloqueado {
    opacity: 0.45;
    filter: grayscale(100%);
    cursor: not-allowed;
}

/* GRADE DOS PARTICIPANTES */
.lista-participantes {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 15px;

    width: 100%;
    max-width: 600px;
    margin: 30px auto;
}

/* CARD INDIVIDUAL */
.card-participante {
    width: 100%;
    min-width: 0;
}

/* FOTO DO PARTICIPANTE */
.card-participante img {
    display: block;
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    border-radius: 12px;
}

/* CELULAR */
@media (max-width: 600px) {
    .lista-participantes {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
    }
}


/* CARD DOS PARTICIPANTES */
.card-participante {
    background: rgba(255, 255, 255, 0.18);
    border: 2px solid rgba(255, 255, 255, 0.5);
    border-radius: 14px;
    padding: 10px;
    transition: 0.25s;
}

/* ÁREA CLICÁVEL */
.opcao-participante {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    cursor: pointer;
}

/* ESCONDE O RADIO ORIGINAL */
.opcao-participante input {
    position: absolute;
    opacity: 0;
}

/* NOME */
.opcao-participante h3 {
    margin: 5px 0;
    font-size: 0.95rem;
}

/* BOTÃO VISUAL DE SELEÇÃO */
.seletor-voto {
    background: rgba(255, 255, 255, 0.2);
    border: 1px solid white;
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 0.75rem;
    font-weight: bold;
}

/* CARD SELECIONADO */
.card-participante:has(input:checked) {
    background: #ff3cac;
    border-color: white;
    transform: scale(1.04);
    box-shadow: 0 0 15px rgba(255,255,255,0.5);
}

/* TEXTO DO CARD SELECIONADO */
.card-participante:has(input:checked) .seletor-voto {
    background: white;
    color: #c926d8;
}

/* CARD BLOQUEADO */
.card-bloqueado {
    opacity: 0.45;
    filter: grayscale(100%);
    cursor: not-allowed;
}

.card-bloqueado .opcao-participante {
    cursor: not-allowed;
}

/* CABEÇALHO GLPC */
.cabecalho-glpc {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px;
    width: 100%;
    margin: 20px auto 35px;
}

/* LOGO */
.logo-glpc {
    width: clamp(180px, 60%, 480px);
    height: auto;
    object-fit: contain;
}

/* FOTO REDONDA DO GRUPO */
.foto-grupo {
    width: clamp(75px, 18vw, 120px);
    aspect-ratio: 1 / 1;
    object-fit: cover;
    border-radius: 50%;
    border: 3px solid white;
    box-shadow: 0 0 12px rgba(255, 255, 255, 0.4);
    flex-shrink: 0;
}

/* AJUSTE PARA CELULAR */
@media (max-width: 480px) {
    .cabecalho-glpc {
        gap: 10px;
    }

    .logo-glpc {
        width: 65%;
    }
}

/* ÁREA DE IDENTIFICAÇÃO */
.insert {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
    width: 100%;
    max-width: 520px;
    margin: 30px auto;
    align-items: center;
}

/* CAMPO DE NOME */
.insert input {
    grid-column: 1 / -1;
    width: 100%;
    padding: 16px 20px;

    background: rgba(255, 255, 255, 0.92);
    color: #333;

    border: 2px solid rgba(255, 255, 255, 0.8);
    border-radius: 14px;

    font-family: 'Montserrat', sans-serif;
    font-size: 1rem;

    outline: none;
    transition: 0.25s;
}

/* EFEITO AO CLICAR NO CAMPO */
.insert input:focus {
    border-color: #ff3cac;
    box-shadow: 0 0 12px rgba(255, 60, 172, 0.5);
    background: white;
}

/* TEXTO DO PLACEHOLDER */
.insert input::placeholder {
    color: #999;
}

/* BOTÕES DA IDENTIFICAÇÃO */
.insert button {
    width: 100%;
    min-width: 0;
    padding: 15px 10px;
    font-size: 1rem;
    border-radius: 12px;
}

/* AJUSTE PARA CELULARES */
@media (max-width: 480px) {
    .insert {
        max-width: 360px;
        gap: 10px;
    }

    .insert button {
        font-size: 0.85rem;
        padding: 14px 8px;
    }
}

/* CARDS DOS PRÓXIMOS ROLÊS */
.card-role {
    background: rgba(255, 255, 255, 0.18);
    border: 2px solid rgba(255, 255, 255, 0.5);

    font-size: 1.2rem;
    font-weight: 800;
}

<body>

        const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbztN028k65cUeiFn6jtwVWi8uXrYU4pXOXEWG5_wvJhzeWFJn6pBxkc1OdyrG37-iTE/exec";

// GERAR CARDS VOTAÇÃO AMIGOS

function gerarCardsParticipantes() {

    const container = document.getElementById("listaParticipantes");

    container.innerHTML = "";

    const nomeUsuario = localStorage.getItem("nomeUsuario");

    participantes.forEach(participante => {

const card = `

                type="radio"

        </label>

    </div>
`;


        container.innerHTML += card;

    });

}

</div>

        // MAPA DE SONS DOS BOTÕES
        const sonsDosBotoes = {

            "Enviar carinho 🤍": "mp3/carinho.mp3",
            "Fazer reclamação 😡": "mp3/reclamacao.mp3"

        // TOCAR O SOM DO BOTÃO CLICADO
        function tocarSom(textoDoBotao) {
            const arquivo = sonsDosBotoes[textoDoBotao];

            if (!arquivo) {
                return;

            const som = new Audio(arquivo);

        // Vamos manter esta função para reutilizá-la nas próximas etapas.
        function mostrarPergunta(texto, opcoes) {
            const tela = document.getElementById("tela");

            tela.innerHTML = `

        function telaReclamacao() {
            const tela = document.getElementById("tela");

            tela.innerHTML = `
                <h1>Central de Reclamações</h1>

                <form class="formulario-reclamacao"
                      onsubmit="enviarReclamacao(event)">

                    <label for="intensidade">
                        Intensidade da reclamação (1 a 5)
                    </label>

                        <option value="">Selecione</option>
                        <option value="1">1 - Leve</option>
                        <option value="2">2 - Moderada</option>
                        <option value="3">3 - Séria</option>
                        <option value="4">4 - Muito séria</option>
                        <option value="5">5 - ABSURDA</option>
                    </select>

                    <label for="reclamacao">Sua reclamação</label>

                    <textarea
                        id="reclamacao"
                        placeholder="Escreva sua reclamação..."
                        required
                    ></textarea>

                    <button type="submit">Enviar Reclamação</button>

                    <button type="button" class="btn-voltar" onclick="telaInicial()">
                        Voltar
                    </button>
                </form>
            `;

        // ENVIAR RECLAMAÇÃO PARA O GOOGLE SHEETS
        
async function enviarReclamacao(event) {
    event.preventDefault();

    const nome = localStorage.getItem("nomeUsuario");
    const reclamacao = document.getElementById("reclamacao").value.trim();
    const intensidade = document.getElementById("intensidade").value;

    if (!nome || !reclamacao || !intensidade) {
        alert("Preencha todos os campos antes de enviar!");
        return;
    }

    const botao = event.submitter;
    botao.disabled = true;
    botao.textContent = "Enviando...";

    try {
        await fetch(URL_SCRIPT, {
            method: "POST",
            mode: "no-cors",
            headers: {
                "Content-Type": "text/plain;charset=utf-8"
            },
            body: JSON.stringify({
                tipo: "reclamacao",
                nome: nome,
                reclamacao: reclamacao,
                intensidade: intensidade
            })
        });

        alert("Reclamação enviada! Senta lá e godrink.");

        event.target.reset();

        document.getElementById("reclamacao").value = "";
        document.getElementById("intensidade").value = "";

    } catch (erro) {
        alert("Não foi possível enviar. Tente novamente.");
        console.error(erro);

    } finally {
        botao.disabled = false;
        botao.textContent = "Enviar Reclamação";
    }
}

async function enviarRole(event) {
    event.preventDefault();

    const nome = localStorage.getItem("nomeUsuario");
    const data = document.getElementById("dataRole").value;
    const categoria = document.getElementById("categoriaRole").value;

    const interesseSelecionado = document.querySelector('input[name="nivelInteresse"]:checked');
    const interesse = interesseSelecionado ? interesseSelecionado.value : "";

    const descricao = document.getElementById("descricaoRole").value.trim();

    if (!nome || !data || !categoria || !interesse || !descricao) {
        alert("Preencha todos os campos antes de enviar!");
        return;
    }

    const botao = event.submitter;

    botao.disabled = true;
    botao.textContent = "Enviando...";

    // TOCAR ÁUDIO AO ENVIAR ROLÊ
const somRole = new Audio("mp3/cassinao.mp3");
somRole.volume = 0.3;

somRole.play().catch(erro => {
    console.log("Não foi possível reproduzir o áudio:", erro);
});

    try {
        await fetch(URL_SCRIPT, {
            method: "POST",
            mode: "no-cors",
            headers: {
                "Content-Type": "text/plain;charset=utf-8"
            },
            body: JSON.stringify({
                tipo: "role",
                nome: nome,
                data: data,
                categoria: categoria,
                interesse: interesse,
                descricao: descricao
            })
        });

        alert("Solicitação enviada! Agora é esperar a galera animar! 🎉");

        event.target.reset();

    } catch (erro) {
        alert("Não foi possível enviar sua solicitação. Tente novamente.");
        console.error(erro);

    } finally {
        botao.disabled = false;
        botao.textContent = "Enviar solicitação";
    }
}


async function votarAmigo() {

    const nomeUsuario = localStorage.getItem("nomeUsuario");

    const selecionado = document.querySelector(
        'input[name="votoAmigo"]:checked'
    );

    if (!selecionado) {
        alert("Escolha alguém para votar!");
        return;
    }

    const indicado = selecionado.value;

    const botao = document.querySelector(
        '.container-votacao button[onclick="votarAmigo()"]'
    );

    botao.disabled = true;
    botao.textContent = "Enviando voto...";

    try {

        await fetch(URL_SCRIPT, {
            method: "POST",
            mode: "no-cors",
            headers: {
                "Content-Type": "text/plain;charset=utf-8"
            },
            body: JSON.stringify({
                tipo: "amigoMes",
                nome: nomeUsuario,
                indicado: indicado
            })
        });

        alert("Voto enviado! Obrigado por participar! 🤍");

    } catch (erro) {

        alert("Não foi possível enviar seu voto. Tente novamente.");
        console.error(erro);

    } finally {

        botao.disabled = false;
        botao.textContent = "Votar";

    }
}
