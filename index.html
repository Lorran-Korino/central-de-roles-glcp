<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balcão de Atendimento</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;800&display=swap" rel="stylesheet">

    <style>
        /* APARÊNCIA GERAL DA PÁGINA */
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(to bottom, #FF3CAC, #2BE7FF);
            color: #fff;
            font-family: 'Montserrat', sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .texto-gradiente {
            background: linear-gradient(to bottom, #d8ff2b, #b3ff00);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        #tela {
            width: 100%;
            max-width: 850px;
            padding: 30px;
        }

        h1 {
            font-size: clamp(1.2rem, 3vw, 2rem);
            margin-bottom: 40px;
        }

        .botoes {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        button {
            background: linear-gradient(#f565ca, #c926d8af) padding-box,
                linear-gradient(to bottom, #f8f8f859, #fffeff56) border-box;
            color: #f7f2f6;
            border: 3px solid transparent;
            border-radius: 8px;
            padding: 15px 35px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background-color: #0fd4f7;
            color: #fff;
        }

        /* FORMULÁRIO DE RECLAMAÇÕES E SUGESTÕES */
        .formulario-reclamacao {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
        }

        .campo-nome {
            display: flex;
            gap: 10px;
            align-items: stretch;
        }

        .campo-nome input {
            flex: 1;
            min-width: 0;
            width: 100%;
            padding: 14px;
            border: 2px solid white;
            border-radius: 8px;
            font-family: 'Montserrat', sans-serif;
            font-size: 1rem;
        }

        .botao-anonimo {
            padding: 10px 14px;
            font-size: 0.85rem;
            white-space: normal;
        }

        @media (max-width: 600px) {
            .campo-nome {
                flex-direction: column;
            }
        }

        .formulario-reclamacao label {
            text-align: left;
            font-weight: 700;
        }

        .formulario-reclamacao select,
        .formulario-reclamacao textarea {
            width: 100%;
            padding: 14px;
            border: 2px solid white;
            border-radius: 8px;
            font-family: 'Montserrat', sans-serif;
            font-size: 1rem;
        }

        .formulario-reclamacao textarea {
            min-height: 150px;
            resize: vertical;
        }

        /* BOTÃO EXCLUSIVO DE RECLAMAÇÃO */
        .botao-reclamacao {
            background: linear-gradient(135deg, #ff3333, #8b0000);
            color: white;
            border: 2px solid white;
            border-radius: 8px;
            padding: 15px 35px;
            font-family: 'Montserrat', sans-serif;
            font-size: 1.2rem;
            font-weight: 800;
            cursor: pointer;
            transition: 0.3s;
        }

        .botao-reclamacao:hover {
            background: linear-gradient(135deg, #ff6666, #cc0000);
            transform: scale(1.05);
        }

        /* FORMULÁRIO DE SOLICITAÇÃO DE ROLÊ */

.formulario-role {
    display: flex;
    flex-direction: column;
    gap: 15px;
    width: 100%;
    max-width: 600px;
    margin: 0 auto;
    text-align: left;
}

.formulario-role label {
    font-weight: 700;
}

.formulario-role input[type="date"],
.formulario-role select,
.formulario-role textarea {
    width: 100%;
    padding: 14px;
    border: 2px solid white;
    border-radius: 8px;
    font-family: 'Montserrat', sans-serif;
    font-size: 1rem;
}

.formulario-role textarea {
    min-height: 130px;
    resize: vertical;
}

        /* TRANSIÇÃO ENTRE TELAS */
        #tela > * {
            animation: aparecer 0.4s ease both;
        }

        @keyframes aparecer {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* BORDA DECORATIVA DA PÁGINA */
        body::before {
            content: "";
            position: fixed;
            inset: 15px;
            border: 3px solid #fdfdfd;
            border-radius: 10px;
            pointer-events: none;
            z-index: 9999;
        }

        .opcoes-interesse {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 10px;
        }

        .opcoes-interesse label {
            padding: 12px 16px;
            border: 2px solid white;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
        }

        .opcoes-interesse input[type="radio"] {
            display: none;
        }

        .opcoes-interesse input[type="radio"]:checked + label {
            background: #FF3CAC;
            border-color: #FF3CAC;
            color: white;
            transform: scale(1.03);
        }

    </style>
</head>

<body>

    <main id="tela"></main>

    <script>
        const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbztN028k65cUeiFn6jtwVWi8uXrYU4pXOXEWG5_wvJhzeWFJn6pBxkc1OdyrG37-iTE/exec";

        // MAPA DE SONS DOS BOTÕES
        const sonsDosBotoes = {
            "Preciso de ajuda! 🧡": "mp3/ajuda.mp3",
            "Enviar carinho 🤍": "mp3/carinho.mp3",
            "Fazer reclamação 😡": "mp3/reclamacao.mp3"
        };

        // TOCAR O SOM DO BOTÃO CLICADO
        function tocarSom(textoDoBotao) {
            const arquivo = sonsDosBotoes[textoDoBotao];

            if (!arquivo) {
                return;
            }

            const som = new Audio(arquivo);
            som.play();
        }

        // MOSTRAR UMA TELA COM PERGUNTA E OPÇÕES
        // Vamos manter esta função para reutilizá-la nas próximas etapas.
        function mostrarPergunta(texto, opcoes) {
            const tela = document.getElementById("tela");

            tela.innerHTML = `
                <h1>${texto}</h1>
                <div class="botoes">
                    ${opcoes.map(opcao => `
                        <button onclick="${opcao.acao}">
                            ${opcao.texto}
                        </button>
                    `).join("")}
                </div>
            `;
        }

        // TELA DE RECLAMAÇÕES E SUGESTÕES
        function telaReclamacao() {
            const tela = document.getElementById("tela");

            tela.innerHTML = `
                <h1>Central de Reclamações</h1>

                <form class="formulario-reclamacao"
                      onsubmit="enviarReclamacao(event)">

                    <label for="intensidade">
                        Intensidade da reclamação (1 a 5)
                    </label>

                    <select id="intensidade" required>
                        <option value="">Selecione</option>
                        <option value="1">1 - Leve</option>
                        <option value="2">2 - Moderada</option>
                        <option value="3">3 - Séria</option>
                        <option value="4">4 - Muito séria</option>
                        <option value="5">5 - ABSURDA</option>
                    </select>

                    <label for="reclamacao">Sua reclamação</label>

                    <textarea
                        id="reclamacao"
                        placeholder="Escreva sua reclamação..."
                        required
                    ></textarea>

                    <button type="submit">Enviar Reclamação</button>

                    <button type="button" onclick="telaInicial()">
                        Voltar
                    </button>
                </form>
            `;
        }

        // ENVIAR RECLAMAÇÃO PARA O GOOGLE SHEETS
        
async function enviarReclamacao(event) {
    event.preventDefault();

    const nome = localStorage.getItem("nomeUsuario");
    const reclamacao = document.getElementById("reclamacao").value.trim();
    const intensidade = document.getElementById("intensidade").value;

    if (!nome || !reclamacao || !intensidade) {
        alert("Preencha todos os campos antes de enviar!");
        return;
    }

    const botao = event.submitter;
    botao.disabled = true;
    botao.textContent = "Enviando...";

    try {
        await fetch(URL_SCRIPT, {
            method: "POST",
            mode: "no-cors",
            headers: {
                "Content-Type": "text/plain;charset=utf-8"
            },
            body: JSON.stringify({
                tipo: "reclamacao",
                nome: nome,
                reclamacao: reclamacao,
                intensidade: intensidade
            })
        });

        alert("Reclamação enviada! Senta lá e godrink.");

        document.getElementById("reclamacao").value = "";
        document.getElementById("intensidade").value = "";

    } catch (erro) {
        alert("Não foi possível enviar. Tente novamente.");
        console.error(erro);

    } finally {
        botao.disabled = false;
        botao.textContent = "Enviar Reclamação";
    }
}



function telaSolicitarRole() {
    const tela = document.getElementById("tela");

    tela.innerHTML = `

        <h1>
            Sim, vamo marcar!
        </h1>

        <form class="formulario-role" onsubmit="enviarRole(event)">

            <label for="dataRole">Quando será o rolê?</label>

            <input
                type="date"
                id="dataRole"
                required
            >

            <label for="categoriaRole">Qual será o tipo de rolê?</label>

            <select id="categoriaRole" required>
                <option value="">Selecione uma categoria</option>
                <option value="Rolê Caseiro">Rolê Caseiro</option>
                <option value="Jogatina Caseira">Jogatina Caseira</option>
                <option value="Bar & Restaurante">Bar & Restaurante</option>
                <option value="Esporte & Diversão">Esporte & Diversão</option>
                <option value="Viagem">Viagem</option>
                <option value="Churrasco">Churrasco</option>
                <option value="Cinema">Cinema</option>
            </select>

            <label>Qual o seu nível de animação?</label>

            <div class="opcoes-interesse">

                <input
                    type="radio"
                    id="interesse1"
                    name="nivelInteresse"
                    value="1"
                    required
                >
                <label for="interesse1">1 - Podíamos sair</label>

                <input
                    type="radio"
                    id="interesse2"
                    name="nivelInteresse"
                    value="2"
                >
                <label for="interesse2">2 - Tô animando</label>

                <input
                    type="radio"
                    id="interesse3"
                    name="nivelInteresse"
                    value="3"
                >
                <label for="interesse3">3 - A gente vai vendo</label>

                <input
                    type="radio"
                    id="interesse4"
                    name="nivelInteresse"
                    value="4"
                >
                <label for="interesse4">4 - Vamos marcar logo!</label>

                <input
                    type="radio"
                    id="interesse5"
                    name="nivelInteresse"
                    value="5"
                >
                <label for="interesse5">5 - PRECISAMOS URGENTE!</label>

            </div>

            <label for="descricaoRole">Qual será o rolê?</label>

            <textarea
                id="descricaoRole"
                placeholder="Ex: Vamos marcar uma sinuca no Sabão..."
                required
            ></textarea>

            <div class="botoes">

    <button type="submit">
        Enviar solicitação
    </button>

    <button type="button" onclick="telaInicial()">
        Voltar
    </button>

        </div>

        </form>
    `;
}


async function enviarRole(event) {
    event.preventDefault();

    const nome = localStorage.getItem("nomeUsuario");
    const data = document.getElementById("dataRole").value;
    const categoria = document.getElementById("categoriaRole").value;

    const interesseSelecionado = document.querySelector('input[name="nivelInteresse"]:checked');
    const interesse = interesseSelecionado ? interesseSelecionado.value : "";

    const descricao = document.getElementById("descricaoRole").value.trim();

    if (!nome || !data || !categoria || !interesse || !descricao) {
        alert("Preencha todos os campos antes de enviar!");
        return;
    }

    const botao = event.submitter;

    botao.disabled = true;
    botao.textContent = "Enviando...";

    try {
        await fetch(URL_SCRIPT, {
            method: "POST",
            mode: "no-cors",
            headers: {
                "Content-Type": "text/plain;charset=utf-8"
            },
            body: JSON.stringify({
                tipo: "role",
                nome: nome,
                data: data,
                categoria: categoria,
                interesse: interesse,
                descricao: descricao
            })
        });

        alert("Solicitação enviada! Agora é esperar a galera animar! 🎉");

    } catch (erro) {
        alert("Não foi possível enviar sua solicitação. Tente novamente.");
        console.error(erro);

    } finally {
        botao.disabled = false;
        botao.textContent = "Enviar solicitação";
    }
}


        function telaAmigoDoMes() {
            const tela = document.getElementById("tela");
            tela.innerHTML = `
            <h1> 
                Teste Amigo do Mês
            </h1>

            <div class="botoes">
                <button onclick= "telaInicial()">
                    Voltar
                    </button>
            </div>    
            ` ;
        }

        // MENU PRINCIPAL ATUAL
        // As opções de rolê e amigo do mês serão programadas nas próximas etapas.
        function telaInicial() {
            const tela = document.getElementById("tela");
            const nomeSalvo = localStorage.getItem("nomeUsuario");
            tela.innerHTML = `
                <h1 class="texto-gradiente"> 
                    Central de amizade do GLPC (Grupo Legal Pra Caramba).
                </h1> 

                <h2> Bem vindo(a) ${nomeSalvo}. 
                
                    </h2>

                <div class="botoes">
                    <button onclick="tocarSom('Preciso de ajuda! 🧡'); telaSolicitarRole()">
                        Solicitar rolê! 🧡
                    </button>

                    <button onclick="tocarSom('Enviar carinho 🤍'); telaAmigoDoMes()">
                        Amigo do mês 🤍
                    </button>

                    <button class="botao-reclamacao"
                            onclick="tocarSom('Fazer reclamação 😡'); telaReclamacao()">
                        Fazer reclamação 😡
                    </button>
                </div>
            `;
        }

        function telaIdentificacao () {
            const tela = document.getElementById("tela");

            tela.innerHTML = `
                 <h1> Bem-vindo(a) ao GLPC! Como podemos te chamar? </h1>

                 <div class="insert">
                    
                <input type="text" id="nomeUsuario" placeholder="Digite seu nome">

                <button onclick= "entrarNoSite()">
                    Entrar
                </button>

                <button onclick="entrarAnonimamente()">
                    Entrar anônimo 👀
                </button>    
                 
                </div>  
            `      

        }

        function entrarNoSite (){
            const nome = document.getElementById("nomeUsuario").value.trim();

            if (nome === "") {
    alert("Digite seu nome!");
        } else {
    localStorage.setItem("nomeUsuario", nome);
    telaInicial()
        }

        }

        function entrarAnonimamente() {
            localStorage.setItem("nomeUsuario", "Arregão(ona)");
            telaInicial();
    
        }

        // INICIA O SITE
        const nomeSalvo = localStorage.getItem("nomeUsuario");

if (nomeSalvo === null) {
    telaIdentificacao();
} else {
    telaInicial();
}
    </script>

</body>
</html>
